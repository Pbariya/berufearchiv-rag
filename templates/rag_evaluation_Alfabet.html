<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatbot Interface</title>
    <link rel="icon" type="image/png" src="static/images/alfabete-a-icon-circle">
    <style>
      body {
        font-family: "Roboto", "Helvetica", Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f4f7f6;
      }
      .stars {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 10px;
      }
      .star-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 20%; /* Adjust width to space out evenly */
      }
      .star {
        unicode-bidi: bidi-override;
        color: #918484;
        font-size: 25px;
        cursor: pointer;
        position: relative;
        margin: 0 5px;
      }

      .stars .star:before {
        content: "\2606";
        color: #918484;
      }

      .stars .star.active:before {
        content: "\2605";
        color: #ffcc00;
      }

      .rating-labels {
        display: flex;
        justify-content: space-between;
        /*padding: 0 20px;*/
        margin-top: 5px;
      }

      .rating-label {
        text-align: center;
        width: 10%;
        /*width: 60px;*/
        margin: 0 5px;
      }

      /* Loading dots animation */
      @keyframes dots {
        0%,
        20% {
          color: rgba(0, 0, 0, 0);
          text-shadow: 0.3em 0 0 rgba(0, 0, 0, 0), 0.6em 0 0 rgba(0, 0, 0, 0);
        }
        40% {
          color: black;
          text-shadow: 0.3em 0 0 rgba(0, 0, 0, 0), 0.6em 0 0 rgba(0, 0, 0, 0);
        }
        60% {
          text-shadow: 0.3em 0 0 black, 0.6em 0 0 rgba(0, 0, 0, 0);
        }
        80%,
        100% {
          text-shadow: 0.3em 0 0 black, 0.6em 0 0 black;
        }
      }

      .dots::after {
        content: " .";
        animation: dots 1s steps(5, end) infinite;
      }

      .disabled {
        background-color: #ccc;
        cursor: not-allowed;
      }

      .enabled {
        background-color: #4caf50;
        color: #fff;
        cursor: pointer;
      }

      .container1 {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
        display: flex;
        justify-content: center; /* Center the chat container */
        align-items: flex-start;
        position: relative; /* Add relative positioning for feedback form */
      }
      h1 {
        margin-left: 140px;
        color: #fff;
      }

      #chat-container {
        border: 2px solid #4db6ac;
        border-radius: 5px;
        padding: 20px;
        background-color: #fff;
        width: 55%;
        min-width: 300px;
        flex-shrink: 0;
        max-width: 700px;
        position: relative; /* Ensure chat container stays relative to feedback */
      }

      #chat-history {
        height: 300px;
        overflow-y: scroll;
        border-bottom: 1px solid #ccc;
        margin-bottom: 20px;
      }

      #chat-history p {
        margin: 5px 0;
      }

      .input-container {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
      }

      #user_message {
        flex: 1;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        margin-right: 10px;
      }

      #model_name,
      #rating {
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        margin-right: 10px;
      }

      button {
        padding: 10px 20px;
        background-color: #4caf50;
        color: #fff;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.3s;
      }

      .button1 {
        background-color: #4ca6bb;
        color: #000;
        margin-left: 2px;
      }
      .button2 {
        background-color: rgb(224, 104, 104);
        color: #000;
        margin-left: 2px;
      }

      button:hover {
        background-color: #45a049;
      }

      .disclaimer {
        background-color: #f8d7da;
        color: #721c24;
        padding: 20px;
        margin-bottom: 20px;
        border-radius: 5px;
        position: relative;
      }

      .disclaimer button {
        background: none;
        border: none;
        color: inherit;
        cursor: pointer;
        position: absolute;
        top: 1px;
        right: 10px;
      }

      .description-container {
        background-color: #d2d9e0;
        color: #011f3d;
        padding: 20px;
        margin-bottom: 20px;
        border-radius: 5px;
        margin-top: 20px;
        width: 61%; /* Adjust width to match chatbox */
        margin: 0 auto;
      }

      .description-box p {
        margin: 0;
      }

      .description-box a {
        color: #00718a;
        text-decoration: underline;
      }

      /* Responsive design */
      @media screen and (max-width: 600px) {
        .container,
        .container1 {
          padding: 10px;
          width: 100%;
        }

        h1 {
          margin-right: 0;
          font-size: 1.2em;
          color: #fff;
        }

        #chat-container,
        #feedback-form {
          padding: 10px;
          width: 100%;
        }

        #user_message,
        #model_name,
        #rating,
        #feedback-text {
          width: 100%;
        }
      }

      #feedback-form {
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 20%; /* Smaller width for feedback */
        min-width: 200px;
        position: absolute; /* Make it absolutely positioned */
        top: 0;
        right: -40px; /* Place it to the right of the chat container */
        top: 75px;
      }

      #feedback-form h2 {
        margin-top: 10px;
        text-align: center;
      }

      .feedback-container {
        margin-bottom: 10px;
        text-align: center;
      }

      .feedback-container {
        border: solid;
        border-width: 2px;
      }

      .feedback-button {
        text-align: center;
      }

      #feedback-text {
        width: 100%;
        height: 100px;
        margin-bottom: 10px;
      }

      .navbar {
        display: flex;
        justify-content: space-between;
        background: linear-gradient(to left, #191975, #008080);
        align-items: center;
        /*background-color: #4db6ac;*/
        color: #000;
        padding: 20px 0;
        margin: 0 auto 20px;
      }

      .container {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .logo-container {
        display: flex;
        align-items: center;
        margin-right: 10px;
      }

      .logo {
        height: 40px;
        margin-right: 400px;
      }

      .title {
        margin: 0;
      }
      .chat-message {
        display: flex;
        margin: 10px 0;
        width: 100%; /* Ensure the message takes up the full width */
      }

      .user-message {
        justify-content: flex-end;
        text-align: right;
      }

      .chatbot-message {
        justify-content: flex-start;
        text-align: left;
      }

      .message-content {
        display: inline-block;
        padding: 10px;
        border-radius: 10px;
        max-width: 100%; 
        word-wrap: break-word; 
        overflow-wrap: break-word; 
        box-sizing: border-box;
      }

      .user-message .message-content {
        background-color: #d1e7dd;
        color: #0c4128;
        /*border-radius: 15px 15px 0 15px;*/
      }

      .chatbot-message .message-content {
        background-color: #e1e6eb;
        color: #000000;
        /*border-radius: 15px 15px 15px 0;*/
      }
      .thumb-up,
      .thumb-down {
        font-size: 28px;
        cursor: pointer;
        margin: 0 15px;
        transition: transform 0.2s ease, color 0.2s ease;
        color: #808080 !important; /* Default grey color */
        display: inline-block;
        padding: 8px;
        border-radius: 50%;
      }

      .thumb-up:hover,
      .thumb-down:hover {
        transform: scale(1.2);
      }

      /* Active thumb colors (works for all models) */
      .thumb-up.active {
        color: #2ecc71 !important;
      }

      .thumb-down.active {
        color: #e74c3c !important;
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <div class="container">
        <div class="logo-container"></div>
        <img
          src="static/images/alfabet-a-bizzdesign-co-logo-white.svg"
          alt="Logo"
          class="logo"
        />
        <h1>Alfabet Help Assistant</h1>
      </div>
    </nav>
    <div class="description-container">
      <div class="description-box">
        <p>
          The Alfabot is a chatbot that searches the Alfabet Help to find
          answers to your questions about using Alfabet.
        </p>
      </div>
    </div>
    <div class="container1">
      <div id="chat-container">
        <div id="chat-history"></div>
        <div class="input-container">
          <input
            type="text"
            id="user_message"
            placeholder="Type your message..."
          />
          <select id="model_name" onchange="onModelSelected()">
            <option value="Claude Model">Claude Model</option>
            <option value="Nova Lite Model">Nova Lite Model</option>
            <option value="Nova Pro Model">Nova Pro Model</option>
            <option value="All Models">All Models</option>
          </select>
          <button id="send-button" onclick="sendMessage()" class="enabled">
            Submit
          </button>
          <button
            class="button1"
            onclick="refreshChat()"
            title="Clear and Restart the session"
          >
            Clear
          </button>
          <button
            id="regenerate-button"
            onclick="regenerateAnswer()"
            class="button2"
            title="Regenerate the response"
            style="display: none"
          >
            Try again
          </button>
        
        </div>
      </div>
      <div id="feedback-form">
        <div id="feedback-container"></div>
        <textarea
          id="feedback-text"
          placeholder="Provide your feedback here..."
        ></textarea>
        <button class="feedback-button" onclick="sendFeedback()">
          Submit Feedback
        </button>
      </div>
    </div>
    <script>
      let isFeedbackProvided = false;
      let isResponseReceived = false;
      let currentQuestion = "";
      let currentModel = "Claude Model";
      let generatingAnswer = true;

      // Latest responses keyed by model name, used when submitting feedback.
      // Example: {"Claude Model": "...", "Nova Lite Model": "...", "Nova Pro Model": "..."}
      let lastResponsesByModel = {};

      function sanitizeInput(input) {
        // Remove script tags
        input = input.replace(
          /<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script>/gi,
          ""
        );

        // Remove any HTML tags
        input = input.replace(/<[^>]*>/g, "");

        // Encode special characters
        input = input
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");

        return input;
      }

      function checkInput() {
        const userMessageElement = document.getElementById("user_message");
        let userMessage = userMessageElement.value;

        // Sanitize input while checking
        userMessage = sanitizeInput(userMessage);
        userMessageElement.value = userMessage;

        if (userMessage.trim() === "") {
          disableSendButton(); // Disable the button if the input is empty
        } else {
          enableSendButton(); // Enable the button if the input is not empty
        }
      }

      function submitFeedback() {
        sendFeedback();
        hideFeedbackForm();
      }

      document.addEventListener("DOMContentLoaded", function () {
        displayWelcomeMessage();
        //onModelSelected();
        // Add event listener for the Enter key
        document
          .getElementById("user_message")
          .addEventListener("input", checkInput);
        disableSendButton();
        document
          .getElementById("user_message")
          .addEventListener("keypress", function (event) {
            if (event.key === "Enter") {
              event.preventDefault();
              sendMessage();
            }
          });
      });
      function checkInput() {
        const userMessage = document.getElementById("user_message").value;
        if (userMessage.trim() === "") {
          disableSendButton(); // Disable the button if the input is empty
        } else {
          enableSendButton(); // Enable the button if the input is not empty
        }
      }
      function scrollToStartOfAnswer(element) {
        const chatHistoryElement = document.getElementById("chat-history");
        chatHistoryElement.scrollTop = element.offsetTop;
      }
      function displayWelcomeMessage() {
        const chatHistoryElement = document.getElementById("chat-history");
        const welcomeMessageElement = document.createElement("p");
        welcomeMessageElement.innerHTML = `<strong>Assistant:</strong> Welcome to the Alfabot! How can I help you?`;
        welcomeMessageElement.id = "welcome-message";
        chatHistoryElement.appendChild(welcomeMessageElement);
        scrollToBottom();
      }
      function removeWelcomeMessage() {
        const welcomeMessageElement =
          document.getElementById("welcome-message");
        if (welcomeMessageElement) {
          welcomeMessageElement.remove();
        }
      }

      function sendMessage() {
        const userMessage = document.getElementById("user_message").value;


        if (userMessage.trim() === "") {
          alert("Please type a message.");
          return;
        }
        if (isResponseReceived && !isFeedbackProvided && !isRatingProvided()) {
          alert("Please provide the rating.");
          return;
        }
        if (isResponseReceived && !isFeedbackProvided) {
          sendFeedback();
        }
        /* removeWelcomeMessage();*/
        displayUserMessage(userMessage);
        displayThinkingMessage();

        const encodedMessage = userMessage
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");

        document.getElementById("user_message").value = "";
        disableSendButton();

        currentQuestion = userMessage;
        const selectedModel = document.getElementById("model_name").value;
        currentModel = selectedModel;
        generatingAnswer = true; // Reset flag

        fetch("/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            user_message: encodedMessage,
            model_name: currentModel,
          }),
        })
          .then((response) => response.json())
          .then((data) => {
            if (generatingAnswer) {
              displayChatHistory(data);

              showFeedbackForm();
              clearStarRatings();
              isFeedbackProvided = false;
              disableSendButton();
            }
          })
          .catch((error) => {
            console.error("Error:", error);
            alert(
              "An error occurred while processing your request. Please try again."
            );
            stopGeneratingAnswer(); // Stop analysing message
            enableSendButton(); // Enable send button again
          });

        isResponseReceived = true;
      }

      function displayUserMessage(message) {
        const chatHistoryElement = document.getElementById("chat-history");
        const userMessageElement = document.createElement("div");
        userMessageElement.classList.add("chat-message", "user-message");

        const messageContent = document.createElement("div");
        messageContent.classList.add("message-content");
        messageContent.innerHTML = `<strong>User:</strong> ${message}`;
        userMessageElement.appendChild(messageContent);

        chatHistoryElement.appendChild(userMessageElement);
        scrollToBottom();
      }

      function displayThinkingMessage() {
        const chatHistoryElement = document.getElementById("chat-history");
        const thinkingMessageElement = document.createElement("p");
        /*thinkingMessageElement.innerHTML = `<em>Chatbot is thinking...</em>`;*/
        thinkingMessageElement.innerHTML = `<em>Analysing<span class="dots"></span></em>`;
        thinkingMessageElement.id = "thinking-message";
        chatHistoryElement.appendChild(thinkingMessageElement);
        scrollToBottom();
      }

      // Stores last answers so feedback can be saved per-model
      window.lastAnswersByModel = {};

      function displayChatHistory(responseData) {
        const chatHistoryElement = document.getElementById("chat-history");
        const thinkingMessageElement =
          document.getElementById("thinking-message");

        if (thinkingMessageElement) {
          thinkingMessageElement.remove();
        }

        responseData["responses"].forEach((response) => {
          const chatbotMessageElement = document.createElement("div");
          chatbotMessageElement.classList.add(
            "chat-message",
            "chatbot-message"
          );

          const messageContent = document.createElement("div");
          messageContent.classList.add("message-content");

          // Save raw response for per-model feedback logging
          if (response.model) {
            window.lastAnswersByModel[response.model] = response.response;
          }

          // Normalize newlines for consistent rendering across models
          let raw = response.response || "";
          raw = raw.replace(/\\r\\n/g, "\n").replace(/\\n/g, "\n");
          raw = raw.replace(/\r\n/g, "\n");

          // Format the response with line breaks and bold text
         let formattedResponse = raw
  // Remove bold markdow
  .replace(/\*\*(.*?)\*\*/g, "$1")

  // Normalize bullet styles:
  // Convert "- text" to "• text"
  .replace(/^\s*-\s+/gm, "• ")

  // Normalize numbered styles:
  // Convert "1. text" or "1)
  .replace(/^\s*(\d+)[\.\)]\s+/gm, "$1) ")

  // Normalize line breaks
  .replace(/\r\n/g, "\n")
  .replace(/\n{2,}/g, "<br><br>")
  .replace(/\n/g, "<br>");

          const modelLabel = response.model ? `<strong>${response.model}:</strong>` : `<strong>Assistant:</strong>`;
          messageContent.innerHTML = `${modelLabel} ${formattedResponse}`;
          chatbotMessageElement.appendChild(messageContent);

          chatHistoryElement.appendChild(chatbotMessageElement);
          scrollToStartOfAnswer(chatbotMessageElement);
        });

        document.getElementById("user_message").value = "";
        document.getElementById("regenerate-button").style.display =
          "inline-block";
      }
      function onModelSelected() {
        const selectedModel = document.getElementById("model_name").value;
        currentModel = selectedModel; // Update the current model
        displayFeedbackPrompt(selectedModel);

      }

      function displayFeedbackPrompt() {
        const feedbackContainer = document.getElementById("feedback-container");

        // If user selected "All Models", show 3 separate ratings
        if (currentModel === "All Models") {
          feedbackContainer.innerHTML = `
            <div>
              <p>Please rate each model response:</p>

              <div class="feedback-container">
                <p><strong>Claude Model</strong></p>
                <div class="thumbs" data-model="Claude Model">
                  <span class="thumb-up" onclick="handleThumbClick(this, 'thumb-up', 'Claude Model')">&#x1F44D;</span>
                  <span class="thumb-down" onclick="handleThumbClick(this, 'thumb-down', 'Claude Model')">&#x1F44E;</span>
                </div>
              </div>

              <div class="feedback-container">
                <p><strong>Nova Lite Model</strong></p>
                <div class="thumbs" data-model="Nova Lite Model">
                  <span class="thumb-up" onclick="handleThumbClick(this, 'thumb-up', 'Nova Lite Model')">&#x1F44D;</span>
                  <span class="thumb-down" onclick="handleThumbClick(this, 'thumb-down', 'Nova Lite Model')">&#x1F44E;</span>
                </div>
              </div>

              <div class="feedback-container">
                <p><strong>Nova Pro Model</strong></p>
                <div class="thumbs" data-model="Nova Pro Model">
                  <span class="thumb-up" onclick="handleThumbClick(this, 'thumb-up', 'Nova Pro Model')">&#x1F44D;</span>
                  <span class="thumb-down" onclick="handleThumbClick(this, 'thumb-down', 'Nova Pro Model')">&#x1F44E;</span>
                </div>
              </div>
            </div>
          `;
        } else {
          // Single model rating
          feedbackContainer.innerHTML = `
            <div>
              <p>Please rate the answer:</p>
              <div class="thumbs" data-model="${currentModel}">
                <span class="thumb-up" onclick="handleThumbClick(this, 'thumb-up', '${currentModel}')">&#x1F44D;</span>
                <span class="thumb-down" onclick="handleThumbClick(this, 'thumb-down', '${currentModel}')">&#x1F44E;</span>
              </div>
            </div>
          `;
        }
      }
      function clearFeedbackContent() {
        const feedbackContainer = document.getElementById("feedback-container");
        feedbackContainer.innerHTML = "";
      }
      function clearStarRatings() {
        const thumbs = document.querySelectorAll(".thumbs span");
        thumbs.forEach((thumb) => {
          thumb.classList.remove("active");
          thumb.style.filter = "grayscale(100%)";
        });
        document.getElementById("feedback-text").value = "";
        window.ratingsByModel = {};
      }

      // Ratings stored per model name
      window.ratingsByModel = {};

      function handleThumbClick(clickedElement, type, modelName) {
        // Reset only within the same model group
        const container = clickedElement.closest(".thumbs");
        const thumbs = container.querySelectorAll("span");
        thumbs.forEach((thumb) => {
          thumb.classList.remove("active");
          thumb.style.filter = "grayscale(100%)";
        });

        clickedElement.classList.add("active");
        if (type === "thumb-up") {
          clickedElement.style.filter =
            "sepia(100%) saturate(300%) brightness(70%) hue-rotate(70deg)";
          window.ratingsByModel[modelName] = 1;
        } else {
          clickedElement.style.filter =
            "sepia(100%) saturate(300%) brightness(70%) hue-rotate(320deg)";
          window.ratingsByModel[modelName] = 0;
        }

        enableSendButton();
      }
      function sendFeedback(isRegenerate = false) {
        const question = currentQuestion;
        const feedback = document.getElementById("feedback-text").value || "";

        // If "All Models" selected, send batch feedback entries
        if (currentModel === "All Models") {
          const entries = ["Claude Model", "Nova Lite Model", "Nova Pro Model"].map(
            (m) => ({
              model_name: m,
              question: question,
              response: window.lastAnswersByModel[m] || "",
              rating: window.ratingsByModel[m],
              feedback: feedback,
              regenerate: isRegenerate ? "Yes" : "No",
            })
          );

          // Validate that every model was rated
          for (const e of entries) {
            if (e.rating === undefined || e.rating === null) {
              alert("Please provide thumbs up/down for ALL three models.");
              return;
            }
          }

          fetch("/feedback", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ entries }),
          })
            .then((response) => response.json())
            .then((data) => {
              console.log(data.status);
              isFeedbackProvided = true;
              hideFeedbackForm();
            })
            .catch((error) => {
              console.error("Error:", error);
              alert(
                "An error occurred while submitting your feedback. Please try again."
              );
              enableSendButton();
            });
          return;
        }

        // Single-model feedback
        const modelName = currentModel;
        const rating = window.ratingsByModel[modelName];

        if (rating === undefined || rating === null) {
          alert("Please provide thumbs up or down.");
          return;
        }

        fetch("/feedback", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            model_name: modelName,
            question: question,
            response: window.lastAnswersByModel[modelName] || "",
            rating: rating,
            feedback: feedback,
            regenerate: isRegenerate ? "Yes" : "No",
          }),
        })
          .then((response) => response.json())
          .then((data) => {
            console.log(data.status);
            isFeedbackProvided = true;
            hideFeedbackForm();
          })
          .catch((error) => {
            console.error("Error:", error);
            alert(
              "An error occurred while submitting your feedback. Please try again."
            );
            enableSendButton(); // Re-enable the submit button in case of an error
          });
      }
      function submitFeedback() {
        sendFeedback();
        hideFeedbackForm();
      }

      function hideFeedbackForm() {
        document.getElementById("feedback-form").style.display = "none";
      }

      function showFeedbackForm() {
        document.getElementById("feedback-form").style.display = "flex";
        clearFeedbackContent();
        displayFeedbackPrompt();
        scrollToBottom();
      }
      function scrollToBottom() {
        const chatHistoryElement = document.getElementById("chat-history");
        const lastMessageElement = chatHistoryElement.lastElementChild;

        if (lastMessageElement) {
          // Scroll to the top of the newest response instead of the bottom
          lastMessageElement.scrollIntoView({
            behavior: "smooth",
            block: "start",
          });
        } else {
          // Fallback if there are no messages
          chatHistoryElement.scrollTop = chatHistoryElement.scrollHeight;
        }
      }
      function regenerateAnswer() {
        document.getElementById("regenerate-button").style.display = "none";

        // Save existing feedback before regenerating
        if (isResponseReceived && !isFeedbackProvided && !isRatingProvided()) {
          sendFeedback(true);
        } else if (!isRatingProvided()) {
          sendFeedback(true);
        }

        displayRegeneratingMessage();

        fetch("/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            user_message: currentQuestion,
            model_name: currentModel,
            regenerate: true,
          }),
        })
          .then((response) => response.json())
          .then((data) => {
            removeRegeneratingMessage();
            displayChatHistory(data);

            // Ensure feedback form is displayed even when limit is reached
            if (!data.limitReached) {
              showFeedbackForm();
              clearStarRatings();
              isFeedbackProvided = false;
            } else {
              // Keep showing feedback form if limit is reached
              showFeedbackForm();
              clearStarRatings();
              document.getElementById("regenerate-button").style.display =
                "none"; // Hide regenerate button
              alert(
                "Regenerate limit reached. Please provide feedback for the last response."
              );
            }
            disableSendButton();
          })
          .catch((error) => {
            console.error("Error:", error);
            alert(
              "An error occurred while processing your request. Please try again."
            );
            stopRegeneratingAnswer();
            enableSendButton();
          });

        isResponseReceived = true;
      }
      // Function to stop regenerating in case of an error
      function stopRegeneratingAnswer() {
        generatingAnswer = false; // Stop answer regeneration
        const regeneratingMessageElement = document.getElementById(
          "regenerating-message"
        );
        if (regeneratingMessageElement) {
          regeneratingMessageElement.remove(); // Remove regenerating message if it exists
        }
        isResponseReceived = false;
      }
      function displayRegeneratingMessage() {
        const chatHistoryElement = document.getElementById("chat-history");
        const regeneratingMessageElement = document.createElement("p");
        regeneratingMessageElement.innerHTML = `<em>Regenerating<span class="dots"></span></em>`;
        regeneratingMessageElement.id = "regenerating-message";
        chatHistoryElement.appendChild(regeneratingMessageElement);
        scrollToBottom();
      }

      function removeRegeneratingMessage() {
        const regeneratingMessageElement = document.getElementById(
          "regenerating-message"
        );
        if (regeneratingMessageElement) {
          regeneratingMessageElement.remove();
        }
      }

      function isRatingProvided() {
        return window.currentRating !== undefined; // Check if a rating is selected
      }

      function enableSendButton() {
        const sendButton = document.getElementById("send-button");
        sendButton.classList.remove("disabled");
        sendButton.classList.add("enabled");
        sendButton.disabled = false;
      }
      function disableSendButton() {
        const sendButton = document.getElementById("send-button");
        sendButton.classList.remove("enabled");
        sendButton.classList.add("disabled");
        sendButton.disabled = true;
      }

      window.onbeforeunload = function () {
        if (isResponseReceived && !isFeedbackProvided && !isRatingProvided()) {
          return "Please provide the rating.";
        }
      };
      function stopGeneratingAnswer() {
        generatingAnswer = false; // Stop answer generation
        const thinkingMessageElement =
          document.getElementById("thinking-message");
        if (thinkingMessageElement) {
          thinkingMessageElement.remove(); // Remove thinking message if it exists
        }
        isResponseReceived = false;
      }

      function refreshChat() {
        // Clear the chat history on the frontend
        document.getElementById("chat-history").innerHTML = "";
        document.getElementById("user_message").value = "";
        document.getElementById("feedback-form").style.display = "none";
        document.getElementById("regenerate-button").style.display = "none"; // Hide the Try Again button

        clearStarRatings();
        isResponseReceived = false;
        generatingAnswer = false;
        isFeedbackProvided = false;
        currentQuestion = "";
        currentModel = "Claude Model";
        document.getElementById("model_name").value = "Claude Model"; // Reset dropdown

        // Clear session on the server-side
        fetch("/clear_session", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
        })
          .then((response) => response.json())
          .then((data) => {
            console.log(data.status); // Log the status for debugging
          })
          .catch((error) => {
            console.error("Error:", error);
          });

        // Reset the sessionStorage (if used)
        sessionStorage.clear();

        // Display the welcome message again
        displayWelcomeMessage();
        enableSendButton(); // Enable the send button when refresh is clicked
      }
    </script>
  </body>
</html>
