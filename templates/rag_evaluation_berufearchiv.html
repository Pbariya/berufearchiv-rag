<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Berufsarchiv RAG</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0e13;--surface:#13161e;--border:#1e2330;
  --accent:#3dffa0;--blue:#5b8af7;--warn:#f0a04a;--red:#f05a5a;
  --text:#ccd0db;--muted:#4b5266;
  --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--sans);font-size:14px;color:var(--text);background:var(--bg)}
.app{display:grid;grid-template-columns:300px 1fr;grid-template-rows:52px 1fr;height:100vh}
header{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:0 20px;
  background:var(--surface);border-bottom:1px solid var(--border)}
.logo{font-family:var(--mono);font-weight:600;color:var(--accent);font-size:14px;letter-spacing:.05em}
.chip{font-family:var(--mono);font-size:10px;color:var(--muted);background:var(--border);
  padding:2px 7px;border-radius:3px}
.chip.live{color:var(--accent);border:1px solid var(--accent);background:rgba(61,255,160,.07)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 8px var(--accent);margin-left:auto;animation:blink 2.5s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.sidebar{background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden}
.sb-block{padding:14px 16px;border-bottom:1px solid var(--border)}
.sb-label{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--muted);
  text-transform:uppercase;margin-bottom:8px}
select{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);
  padding:7px 10px;border-radius:5px;font-family:var(--mono);font-size:12px;
  outline:none;appearance:none;cursor:pointer}
select:hover,select:focus{border-color:var(--blue)}
.row{display:flex;align-items:center;gap:8px}
input[type=range]{flex:1;accent-color:var(--accent);height:3px;cursor:pointer}
.rval{font-family:var(--mono);font-size:12px;color:var(--accent);min-width:18px;text-align:right}
.metrics{flex:1;overflow-y:auto;padding:16px;scrollbar-width:thin;
  scrollbar-color:var(--border) transparent}
.m-row{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.m-lbl{font-family:var(--mono);font-size:12px;color:var(--muted);width:110px;flex-shrink:0}
.m-track{flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.m-fill{height:100%;border-radius:2px;width:0;transition:width .6s ease}
.m-val{font-family:var(--mono);font-size:13px;color:var(--text);width:46px;text-align:right;font-weight:600}
.divider{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.1em;
  text-transform:uppercase;margin:14px 0 8px;border-top:1px solid var(--border);padding-top:10px}
.lat-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px}
.lat-cell{background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:8px 10px}
.lat-k{font-family:var(--mono);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.lat-v{font-family:var(--mono);font-size:15px;color:var(--accent);margin-top:3px}
.model-header{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--accent);
  text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px;padding:5px 10px;
  background:rgba(61,255,160,.07);border:1px solid rgba(61,255,160,.2);
  border-radius:5px;display:inline-block}
.inline-eval{margin-top:12px;padding:14px 16px;background:var(--bg);
  border:1px solid var(--border);border-radius:6px}
.ie-title{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.1em;
  text-transform:uppercase;margin-bottom:10px;font-weight:600}
.ie-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.ie-lbl{font-family:var(--mono);font-size:12px;color:var(--muted);width:120px;flex-shrink:0}
.ie-track{flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.ie-fill{height:100%;border-radius:2px;width:0;transition:width .8s ease}
.ie-val{font-family:var(--mono);font-size:13px;color:var(--text);width:44px;text-align:right;font-weight:700}
.be-badge{font-family:var(--mono);font-size:10px;padding:4px 10px;border-radius:4px;
  border:1px solid var(--warn);color:var(--warn);background:rgba(240,160,74,.08);display:inline-block}
.main{display:flex;flex-direction:column;overflow:hidden}
.history{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;
  gap:18px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.msg{max-width:820px;width:100%}
.msg.user{align-self:flex-end}
.msg.bot{align-self:flex-start}
.bubble{padding:12px 16px;border-radius:9px;white-space:pre-wrap;word-break:break-word;line-height:1.7}
.msg.user .bubble{background:var(--blue);color:#fff;border-bottom-right-radius:3px}
.msg.bot .bubble{background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:3px}
.sources{margin-top:10px}
.src-title{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--muted);
  text-transform:uppercase;margin-bottom:8px}
.src-card{background:var(--bg);border:1px solid var(--border);border-left:3px solid var(--blue);
  border-radius:5px;padding:9px 13px;margin-bottom:7px;cursor:pointer;transition:border-color .15s}
.src-card:hover{border-left-color:var(--accent)}
.src-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.src-name{font-family:var(--mono);font-size:11px;color:var(--text);font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src-sim{font-family:var(--mono);font-size:10px;color:var(--accent);white-space:nowrap}
.src-link{font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src-snippet{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.5;display:none}
.src-card.open .src-snippet{display:block}
.fb-row{display:flex;align-items:center;gap:7px;margin-top:9px}
.fb{background:transparent;border:1px solid var(--border);color:var(--muted);
  padding:4px 14px;border-radius:20px;font-size:13px;cursor:pointer;transition:all .15s}
.fb:hover{border-color:var(--accent);color:var(--accent)}
.fb.on-up{border-color:var(--accent);color:var(--accent);background:rgba(61,255,160,.07)}
.fb.on-down{border-color:var(--red);color:var(--red);background:rgba(240,90,90,.07)}
.run-info{font-family:var(--mono);font-size:9px;color:var(--muted);margin-left:auto}
.fb-text-row{display:flex;gap:7px;margin-top:7px;align-items:flex-end}
.fb-text{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text);
  padding:8px 11px;border-radius:7px;font-family:var(--sans);font-size:12px;
  resize:none;outline:none;line-height:1.4;transition:border-color .15s}
.fb-text:focus{border-color:var(--blue)}
.fb-submit{background:var(--blue);color:#fff;border:none;padding:7px 14px;
  border-radius:7px;font-size:12px;cursor:pointer;white-space:nowrap;transition:opacity .15s}
.fb-submit:hover{opacity:.85}
.inline-lat{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;
  padding:7px 12px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:7px}
.ilat-cell{display:flex;flex-direction:column;align-items:center;min-width:48px}
.ilat-k{font-family:var(--mono);font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.ilat-v{font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:600}
.typing{display:flex;gap:5px;padding:12px 16px;background:var(--surface);
  border:1px solid var(--border);border-radius:9px;border-bottom-left-radius:3px;width:fit-content}
.typing span{width:6px;height:6px;background:var(--muted);border-radius:50%;animation:jump .9s infinite}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.30s}
@keyframes jump{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-5px)}}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;color:var(--muted);text-align:center}
.empty-icon{font-size:40px;opacity:.2}
.empty-txt{font-family:var(--mono);font-size:12px}
.input-area{padding:14px 20px;border-top:1px solid var(--border);background:var(--surface)}
.input-row{display:flex;gap:9px;align-items:flex-end}
textarea{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text);
  padding:11px 14px;border-radius:7px;font-family:var(--sans);font-size:14px;
  resize:none;outline:none;line-height:1.5;max-height:110px;transition:border-color .15s}
textarea:focus{border-color:var(--blue)}
textarea::placeholder{color:var(--muted)}
.send{background:var(--accent);color:var(--bg);border:none;width:42px;height:42px;
  border-radius:7px;cursor:pointer;font-size:16px;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;transition:opacity .15s;font-weight:600}
.send:hover{opacity:.85}
.send:disabled{opacity:.35;cursor:not-allowed}
</style>
</head>
<body>
<div class="app">

<!-- ── HEADER ── -->
<header>
  <span class="logo">&#9658; Berufsarchiv RAG</span>
  <span class="chip live">&#9889; Groq + Mistral</span>
  <span class="chip" id="modelChip">{{ default_model }}</span>
  <span class="chip">BGE-M3 &middot; FAISS &middot; BM25</span>
  <div class="dot"></div>
</header>

<!-- ── SIDEBAR ── -->
<aside class="sidebar">
  <div class="sb-block">
    <div class="sb-label">Model</div>
    <select id="modelSel"
      onchange="
        document.getElementById('modelChip').textContent = this.value;
        document.getElementById('sidebarMetrics').style.display =
          (this.value === 'All Models') ? 'none' : '';
      ">
      {% for k in model_options %}
      <option value="{{ k }}"{% if k == default_model %} selected{% endif %}>{{ k }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="sb-block">
    <div class="sb-label">Top-K Chunks</div>
    <div class="row">
      <input type="range" id="topK" min="1" max="10" value="{{ top_k }}"
        oninput="document.getElementById('kVal').textContent = this.value">
      <span class="rval" id="kVal">{{ top_k }}</span>
    </div>
  </div>

  <div class="sb-block">
    <div class="sb-label">Eval Backend</div>
    <span class="be-badge">{{ active_backend }}</span>
  </div>

  <div class="metrics" id="sidebarMetrics">
    <div class="sb-label">Latest Evaluation</div>
    <div class="m-row">
      <span class="m-lbl">Ans. Relevance</span>
      <div class="m-track"><div class="m-fill" id="f_ar" style="background:var(--accent)"></div></div>
      <span class="m-val" id="v_ar">—</span>
    </div>
    <div class="m-row">
      <span class="m-lbl">Faithfulness</span>
      <div class="m-track"><div class="m-fill" id="f_fa" style="background:var(--blue)"></div></div>
      <span class="m-val" id="v_fa">—</span>
    </div>
    <div class="m-row">
      <span class="m-lbl">Ctx. Precision</span>
      <div class="m-track"><div class="m-fill" id="f_cp" style="background:var(--warn)"></div></div>
      <span class="m-val" id="v_cp">—</span>
    </div>
    <div class="m-row">
      <span class="m-lbl">Ctx. Recall</span>
      <div class="m-track"><div class="m-fill" id="f_cr" style="background:var(--red)"></div></div>
      <span class="m-val" id="v_cr">—</span>
    </div>
    <div class="divider">Latency (seconds)</div>
    <div class="lat-grid" id="latGrid"></div>
  </div>
</aside>

<!-- ── MAIN CHAT AREA ── -->
<main class="main">
  <div class="history" id="hist">
    <div class="empty" id="emptyState">
      <div class="empty-icon">&#11041;</div>
      <div class="empty-txt">Ask a question about the Berufsarchiv</div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-row">
      <textarea id="qBox" rows="2"
        placeholder="Ask a research question… (Enter to send, Shift+Enter for newline)">
      </textarea>
      <button class="send" id="sendBtn" onclick="send()">&#10148;</button>
    </div>
  </div>
</main>

</div>

<script>

function h(s) {
  return String(s || '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
    .replace(/\n/g, '<br>');
}

// Update a sidebar metric bar (id = ar | fa | cp | cr)
function setMetric(id, val) {
  const pct = Math.min(100, Math.max(0, val * 100)).toFixed(1);
  document.getElementById('f_' + id).style.width = pct + '%';
  document.getElementById('v_' + id).textContent  = val.toFixed(3);
}

// Render the sidebar latency grid with all five timing cells
function renderLatency(lat) {
  const labels = {
    lat_embed: 'Embed', lat_retrieve: 'Retrieve',
    lat_generate: 'Generate', lat_eval: 'Evaluate', lat_total: 'Total'
  };
  document.getElementById('latGrid').innerHTML =
    Object.entries(lat).map(([k, v]) =>
      `<div class="lat-cell">
         <div class="lat-k">${labels[k] || k}</div>
         <div class="lat-v">${v}s</div>
       </div>`
    ).join('');
}

// Append a DOM node to the chat history panel and scroll to bottom
function addNode(el) {
  const hist  = document.getElementById('hist');
  const empty = document.getElementById('emptyState');
  if (empty) empty.remove();
  hist.appendChild(el);
  hist.scrollTop = hist.scrollHeight;
  return el;
}

function userBubble(text) {
  const el = document.createElement('div');
  el.className = 'msg user';
  el.innerHTML = `<div class="bubble">${h(text)}</div>`;
  return addNode(el);
}

function thinkingBubble() {
  const el = document.createElement('div');
  el.className = 'msg bot';
  el.innerHTML = `<div class="typing"><span></span><span></span><span></span></div>`;
  return addNode(el);
}

// enforcement of the blind-rating protocol.
// It becomes visible only when _revealEval() is called after feedback.
function botBubble(d, showModelLabel) {

  // Retrieved source cards — click to expand snippet
  const srcHtml = (d.docs || []).map(doc => `
    <div class="src-card" onclick="this.classList.toggle('open')">
      <div class="src-head">
        <span class="src-name">${h(doc.heading || 'Document')}</span>
        <span class="src-sim">sim ${doc.score_sim}</span>
      </div>
      ${doc.link ? `<div class="src-link">&#8961; ${h(doc.link)}</div>` : ''}
      <div class="src-snippet">${h((doc.content || '').slice(0, 600))}${doc.content && doc.content.length > 600 ? '…' : ''}</div>
    </div>`).join('');

  // Inline evaluation panel — hidden until blind gate is lifted
  const inlineEvalHtml = `
    <div class="inline-eval" id="ie-${d.run_id}" style="display:none">
      <div class="ie-title">Evaluation</div>
      <div class="ie-row">
        <span class="ie-lbl">Ans. Relevance</span>
        <div class="ie-track"><div class="ie-fill" id="ie-f-ar-${d.run_id}" style="background:var(--accent)"></div></div>
        <span class="ie-val" id="ie-v-ar-${d.run_id}">—</span>
      </div>
      <div class="ie-row">
        <span class="ie-lbl">Faithfulness</span>
        <div class="ie-track"><div class="ie-fill" id="ie-f-fa-${d.run_id}" style="background:var(--blue)"></div></div>
        <span class="ie-val" id="ie-v-fa-${d.run_id}">—</span>
      </div>
      <div class="ie-row">
        <span class="ie-lbl">Ctx. Precision</span>
        <div class="ie-track"><div class="ie-fill" id="ie-f-cp-${d.run_id}" style="background:var(--warn)"></div></div>
        <span class="ie-val" id="ie-v-cp-${d.run_id}">—</span>
      </div>
      <div class="ie-row">
        <span class="ie-lbl">Ctx. Recall</span>
        <div class="ie-track"><div class="ie-fill" id="ie-f-cr-${d.run_id}" style="background:var(--red)"></div></div>
        <span class="ie-val" id="ie-v-cr-${d.run_id}">—</span>
      </div>
    </div>`;

  const el = document.createElement('div');
  el.className     = 'msg bot';
  el.dataset.runId = d.run_id;

  // Latency strip — Evaluate and Total cells get IDs so _revealEval()
  const lat      = d.latency || {};
  const latItems = [
    ['Embed',    lat.lat_embed],
    ['Retrieve', lat.lat_retrieve],
    ['Generate', lat.lat_generate],
    ['Evaluate', lat.lat_eval],
    ['Total',    lat.lat_total]
  ].filter(([, v]) => v != null);

  const _latId = {
    'Evaluate': 'ilv-eval-'  + d.run_id,
    'Total':    'ilv-total-' + d.run_id
  };

  const latHtml = latItems.length ? `
    <div class="inline-lat">
      ${latItems.map(([k, v]) => {
        const id   = _latId[k] ? ` id="${_latId[k]}"` : '';
        const disp = (v === 0 && k === 'Evaluate') ? '…' : v + 's';
        return `<span class="ilat-cell">
                  <span class="ilat-k">${k}</span>
                  <span class="ilat-v"${id}>${disp}</span>
                </span>`;
      }).join('')}
    </div>` : '';

  el.innerHTML = `
    ${showModelLabel ? `<div class="model-header">&#9658; ${h(d.model)}</div>` : ''}
    <div class="bubble">${h(d.answer)}</div>
    ${srcHtml ? `<div class="sources"><div class="src-title">Retrieved Sources — click to expand</div>${srcHtml}</div>` : ''}
    ${latHtml}
    ${inlineEvalHtml}
    <div class="fb-row">
      <button class="fb" onclick="fb(this, 1, '${d.run_id}')">&#128077; Helpful</button>
      <button class="fb" onclick="fb(this, -1, '${d.run_id}')">&#128078; Not helpful</button>
      <span class="run-info">
        <span class="eval-status" id="es-${d.run_id}">&#8987; eval…</span>
      </span>
    </div>
    <div class="fb-text-row" id="fbt-${d.run_id}" style="display:none">
      <textarea class="fb-text" id="fbtxt-${d.run_id}"
        placeholder="Optional: describe what was helpful or unhelpful…" rows="2"></textarea>
      <button class="fb-submit" onclick="submitFbText('${d.run_id}')">Submit</button>
    </div>`;

  return addNode(el);
}

// Update a single inline metric bar (key = ar | fa | cp | cr)
function setInlineMetric(run_id, key, val) {
  const pct   = Math.min(100, Math.max(0, val * 100)).toFixed(1);
  const fill  = document.getElementById('ie-f-' + key + '-' + run_id);
  const valEl = document.getElementById('ie-v-' + key + '-' + run_id);
  if (fill)  fill.style.width  = pct + '%';
  if (valEl) valEl.textContent = val.toFixed(3);
}


// _pendingEvalResults — blind-evaluation result store.
const _pendingEvalResults = {};


// _revealEval — lift the blind gate and display automated scores.
function _revealEval(run_id, updateSidebar) {
  const d = _pendingEvalResults[run_id];
  if (!d || !d.metrics) return;

  // Fill latency cells that were withheld during the blind phase
  const evalCell  = document.getElementById('ilv-eval-'  + run_id);
  const totalCell = document.getElementById('ilv-total-' + run_id);
  if (evalCell  && d.latency?.lat_eval  != null) evalCell.textContent  = d.latency.lat_eval  + 's';
  if (totalCell && d.latency?.lat_total != null) totalCell.textContent = d.latency.lat_total + 's';

  // Show the hidden evaluation panel
  const panel = document.getElementById('ie-' + run_id);
  if (panel) panel.style.display = 'block';

  setInlineMetric(run_id, 'ar', d.metrics.answer_relevance  || 0);
  setInlineMetric(run_id, 'fa', d.metrics.faithfulness      || 0);
  setInlineMetric(run_id, 'cp', d.metrics.context_precision || 0);
  setInlineMetric(run_id, 'cr', d.metrics.context_recall    || 0);

  // Update sidebar only for the primary single-model response
  if (updateSidebar) {
    setMetric('ar', d.metrics.answer_relevance  || 0);
    setMetric('fa', d.metrics.faithfulness      || 0);
    setMetric('cp', d.metrics.context_precision || 0);
    setMetric('cr', d.metrics.context_recall    || 0);
    renderLatency(d.latency);
  }
}


// pollEval — async poll for background NLI evaluation.
function pollEval(run_id, updateSidebar) {
  const poll = async () => {
    try {
      const r = await fetch('/eval_result/' + run_id);
      const d = await r.json();
      if (!d.ready) { setTimeout(poll, 3000); return; }

      // Store result — do NOT render yet (blind gate still closed)
      _pendingEvalResults[run_id] = d;

      // Prompt annotator to rate before scores are unlocked
      const tag = document.getElementById('es-' + run_id);
      if (tag) {
        tag.textContent = '📋 rate to reveal scores';
        tag.title = 'Submit your 👍 or 👎 rating to unlock the evaluation metrics';
      }

      // Show partial latency (no eval)
      if (d.latency && updateSidebar) {
        const labels = { lat_embed: 'Embed', lat_retrieve: 'Retrieve', lat_generate: 'Generate' };
        document.getElementById('latGrid').innerHTML =
          Object.entries({ lat_embed: d.latency.lat_embed,
                           lat_retrieve: d.latency.lat_retrieve,
                           lat_generate: d.latency.lat_generate })
            .filter(([, v]) => v != null)
            .map(([k, v]) =>
              `<div class="lat-cell">
                 <div class="lat-k">${labels[k]}</div>
                 <div class="lat-v">${v}s</div>
               </div>`)
            .join('') +
          `<div class="lat-cell" style="opacity:0.35">
             <div class="lat-k">Evaluate</div><div class="lat-v">…</div>
           </div>
           <div class="lat-cell" style="opacity:0.35">
             <div class="lat-k">Total</div><div class="lat-v">…</div>
           </div>`;
      }

      // Path B: feedback was submitted before eval finished — reveal now
      if (_fbState[run_id] && _fbState[run_id].rated) {
        _revealEval(run_id, updateSidebar);
        const tag2 = document.getElementById('es-' + run_id);
        if (tag2) tag2.textContent = '✅ eval done';
      } else {
        _fbState[run_id] = _fbState[run_id] || {};
        _fbState[run_id]._updateSidebar = updateSidebar;
      }

    } catch (e) { setTimeout(poll, 5000); }
  };
  setTimeout(poll, 4000);
}


// send — submit a question to /ask and render the response bubble
async function send() {
  const box = document.getElementById('qBox');
  const q   = box.value.trim();
  if (!q) return;

  const modelSel = document.getElementById('modelSel').value;
  const btn      = document.getElementById('sendBtn');
  btn.disabled   = true;
  box.value      = '';

  userBubble(q);
  const think = thinkingBubble();

  try {
    const r = await fetch('/ask', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({
        question: q,
        model:    modelSel,
        top_k:    parseInt(document.getElementById('topK').value)
      })
    });
    const d = await r.json();
    think.remove();

    if (d.error) {
      const el = document.createElement('div');
      el.className = 'msg bot';
      el.innerHTML = `<div class="bubble" style="border-color:var(--red)">Error: ${h(d.error)}</div>`;
      addNode(el);
    } else if (d.all_models) {
      (d.responses || []).forEach(resp => {
        if (resp.answer && resp.answer.startsWith('Error:')) {
          const el = document.createElement('div');
          el.className = 'msg bot';
          el.innerHTML = `<div class="model-header">&#9658; ${h(resp.model)}</div>
            <div class="bubble" style="border-color:var(--red)">${h(resp.answer)}</div>`;
          addNode(el);
        } else {
          botBubble(resp, true);
          pollEval(resp.run_id, false);
        }
      });
    } else {
      botBubble(d, false);
      renderLatency(d.latency);
      pollEval(d.run_id, true);
    }
  } catch (e) {
    think.remove();
    const el = document.createElement('div');
    el.className = 'msg bot';
    el.innerHTML = `<div class="bubble" style="border-color:var(--red)">${h(e.message)}</div>`;
    addNode(el);
  }

  btn.disabled = false;
  box.focus();
}



const _fbState = {};

// fb — BLIND EVALUATION GATE.
// Receives the binary rating (1 = acceptable / -1 = unacceptable).
// Persists the rating to SQLite via POST /feedback, then lifts the gate:
async function fb(btn, rating, runId) {
  const row = btn.parentElement;
  row.querySelectorAll('.fb').forEach(b => b.classList.remove('on-up', 'on-down'));
  btn.classList.add(rating === 1 ? 'on-up' : 'on-down');

  // Persist binary rating immediately
  await fetch('/feedback', {
    method:  'POST',
    headers: { 'Content-Type': 'application/json' },
    body:    JSON.stringify({ run_id: runId, rating, feedback_text: '' })
  });

  // Mark as rated; preserve updateSidebar flag set by pollEval
  _fbState[runId] = _fbState[runId] || {};
  _fbState[runId].rating    = rating;
  _fbState[runId].submitted = false;
  _fbState[runId].rated     = true;

  // Show the optional free-text feedback row
  const textRow = document.getElementById('fbt-' + runId);
  if (textRow) textRow.style.display = 'flex';

  // Lift the blind gate
  const updateSidebar = (_fbState[runId]._updateSidebar !== false);
  if (_pendingEvalResults[runId]) {
    // Path A: eval already complete — reveal scores immediately
    _revealEval(runId, updateSidebar);
    const tag = document.getElementById('es-' + runId);
    if (tag) tag.textContent = '✅ eval done';
  } else {
    // Path B: eval still running 
    _fbState[runId]._updateSidebar = updateSidebar;
    const tag = document.getElementById('es-' + runId);
    if (tag) tag.textContent = '⏳ eval…';
  }
}

// submitFbText — persist optional free-text qualitative feedback.
async function submitFbText(runId) {
  const txt   = (document.getElementById('fbtxt-' + runId)?.value || '').trim();
  const state = _fbState[runId] || { rating: 0 };
  if (state.submitted) return;
  await fetch('/feedback', {
    method:  'POST',
    headers: { 'Content-Type': 'application/json' },
    body:    JSON.stringify({ run_id: runId, rating: state.rating, feedback_text: txt })
  });
  state.submitted = true;
  const textRow = document.getElementById('fbt-' + runId);
  if (textRow) textRow.innerHTML = '<span style="font-size:11px;color:var(--muted)">Feedback saved</span>';
}

// Init — keyboard shortcut and All-Models sidebar hide
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('qBox').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  const sel = document.getElementById('modelSel');
  if (sel && sel.value === 'All Models') {
    document.getElementById('sidebarMetrics').style.display = 'none';
  }
});
</script>
